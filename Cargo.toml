[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["viperadnan"]
publish = false

[workspace.dependencies]
# UI — gpui only, built Zed-style (no third-party component lib). Both crates
# pinned to one zed rev so the source resolves to a single checkout. This rev
# builds standalone with no patches; bump deliberately and re-verify.
gpui = { git = "https://github.com/zed-industries/zed", rev = "b077f41a9f26ae5ed7fadfea55a501d34afb25de" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "b077f41a9f26ae5ed7fadfea55a501d34afb25de", features = ["font-kit"] }

tokio = { version = "1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
thiserror = "2"
anyhow = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rspace-core = { path = "crates/core" }
rspace-rclone-rc = { path = "crates/rclone_rc" }
rspace-ui = { path = "crates/ui" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
