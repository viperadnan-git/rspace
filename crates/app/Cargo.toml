[package]
name = "rspace-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "rspace"
path = "src/main.rs"

# `cargo bundle` packages crates/app into rspace.app with this icon.
[package.metadata.bundle]
name = "rspace"
identifier = "com.viperadnan.rspace"
icon = ["resources/rspace.icns"]
category = "public.app-category.utilities"

[dependencies]
rspace-core.workspace = true
rspace-rclone-rc.workspace = true
rspace-ui.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
