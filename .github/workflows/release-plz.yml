# Generated by `release-plz init` (MarcoIeni/release-plz-action), with two tweaks:
#  1. GITHUB_TOKEN uses the RELEASE_PLZ_TOKEN PAT so the tag it pushes triggers
#     package.yml (the built-in token cannot trigger downstream workflows).
#  2. Dormant until that PAT exists: checkout falls back to the default token and
#     the release-plz step is skipped, so main CI stays green before setup. Add
#     RELEASE_PLZ_TOKEN (contents + pull-requests write) to activate.
name: Release-plz

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
      - name: Install Rust toolchain
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN != '' }}
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
      - name: Install Rust toolchain
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        if: ${{ env.HAS_TOKEN == 'true' }}
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
