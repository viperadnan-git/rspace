# Hand-authored: cargo-packager has no workflow generator for the GitHub-Releases
# path (its only generated CI targets CrabNebula Cloud). This builds the native
# installers, signs the auto-update artifacts, and publishes everything (+ the
# update manifest) to the GitHub Release, triggered by the `vX.Y.Z` tag release-plz
# creates when the Release PR merges.
#
# Installers are UNSIGNED for Gatekeeper/SmartScreen (no paid certs) — users clear
# the one-time prompt (see README). The *updater* artifacts are signed with the
# cargo-packager key so in-app self-update can verify them.
#
# Required repo secrets (named after cargo-packager's env vars, so the mapping is 1:1):
#   CARGO_PACKAGER_SIGN_PRIVATE_KEY          — private key from `cargo packager signer generate`
#   CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD — its password
name: package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build/release"
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 45   # fail fast if a runner never gets allocated (deprecated-image scarcity)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS arches build on a current Apple-Silicon runner (macos-15;
          # macos-14 began deprecation 2026-07-06, macos-13 already gone). x86_64
          # cross-compiles natively, keeping per-arch installers minimal. updater_ext
          # = cargo-packager's file for the updater_format; renamed per-platform
          # since both macOS arches emit the same rspace.app.tar.gz.
          - os: macos-15
            platform: macos-aarch64
            target: aarch64-apple-darwin
            formats: app,dmg
            updater_ext: ".app.tar.gz"
            updater_format: app
          - os: macos-15
            platform: macos-x86_64
            target: x86_64-apple-darwin
            formats: app,dmg
            updater_ext: ".app.tar.gz"
            updater_format: app
          - os: ubuntu-22.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            formats: appimage,deb
            updater_ext: ".AppImage"
            updater_format: appimage
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            formats: nsis,wix
            updater_ext: "-setup.exe"
            updater_format: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # gpui build deps (from Zed's script/linux) + AppImage tooling (FUSE, file).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig-dev libgit2-dev libglib2.0-dev \
            libssl-dev libva-dev libvulkan1 libwayland-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libzstd-dev libsqlite3-dev libfuse2 file

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Package (signed) into dist/
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}   # cargo-packager's build + cross-compile (macOS x86_64 on the arm runner)
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        # Absolute paths: --out-dir is package-relative otherwise (crates/app/dist),
        # and ${{ github.workspace }} is correct across the runners' different shells.
        run: cargo packager --release -p rspace --formats ${{ matrix.formats }} --target ${{ matrix.target }} --out-dir "${{ github.workspace }}/dist" --binaries-dir "${{ github.workspace }}/target/${{ matrix.target }}/release"

      # Stage the release assets from cargo-packager's own out-dir and build this
      # platform's slice of the update manifest ({url, signature, format}). The
      # updater artifact is renamed per-platform so nothing collides on the release.
      - name: Stage assets + update manifest
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p upload frag
          src=$(ls dist/*'${{ matrix.updater_ext }}' 2>/dev/null | head -1)
          [ -n "$src" ] || { echo "no '*${{ matrix.updater_ext }}' in dist/"; ls -la dist; exit 1; }
          updater="rspace-${{ matrix.platform }}${{ matrix.updater_ext }}"
          cp "$src" "upload/$updater"
          sig="$(cat "$src.sig")"
          for f in dist/*.dmg dist/*.deb dist/*.msi; do [ -e "$f" ] && cp "$f" upload/; done
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$updater"
          jq -n --arg u "$url" --arg s "$sig" --arg f "${{ matrix.updater_format }}" \
            '{url:$u, signature:$s, format:$f}' > "frag/${{ matrix.platform }}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            upload
            frag
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dl
          merge-multiple: true

      - name: Assemble latest.json
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Key each platform fragment ({url,signature,format}) by its filename,
          # then merge into one platforms map.
          platforms="$(for f in dl/frag/*.json; do
            jq --arg k "$(basename "$f" .json)" '{($k): .}' "$f"
          done | jq -s 'add')"
          jq -n --arg v "$version" --argjson p "$platforms" \
            '{version:$v, platforms:$p}' > latest.json
          cat latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dl/upload/*
            latest.json
          generate_release_notes: true
